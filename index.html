
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claudio Brito | Global Mentoring Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0d;
            --bg-1: #141414;
            --bg-card: #1a1a1a;
            --bg-2: #222222;
            --bg-3: #2a2a2a;
            --bg-muted: #181818;
            --line: rgba(255, 255, 255, 0.07);
            --line-2: rgba(255, 255, 255, 0.13);
            --divider: rgba(255, 255, 255, 0.17);
            --fg: #f5f5f3;
            --fg-muted: #b8b8b8;
            --fg-subtle: #8a8a8a;
            --fg-dim: #636363;
            --accent: #d4af37;
            --accent-glow: #e8c352;
            --accent-dim: rgba(212, 175, 55, 0.12);
            --r-xs: 6px;
            --r-sm: 10px;
            --r-md: 14px;
            --r-lg: 20px;
            --r-xl: 28px;
            --r-2xl: 36px;
            --r-pill: 9999px;
            --f-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            --f-mono: 'JetBrains Mono', monospace;
            --ease: cubic-bezier(.2, .7, .2, 1);
            --dur-fast: .16s;
            --dur-normal: .28s;
            --dur-slow: .52s;
            --shadow-card: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 8px 24px -12px rgba(0, 0, 0, .6);
            --shadow-glow: 0 0 0 1px rgba(212, 175, 55, 0.35), 0 0 40px -4px rgba(212, 175, 55, 0.45);
        }

        body {
            font-family: var(--f-sans);
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;
        }

        .font-mono-custom {
            font-family: var(--f-mono);
        }

        .gold-gradient {
            background: linear-gradient(135deg, #d4af37 0%, #f1d592 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Minimalist Kicker Badge */
        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 0.7em;
            font-family: var(--f-mono);
            font-size: 0.72rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            color: var(--fg-subtle);
        }
        .kicker::before {
            content: "";
            width: 7px;
            height: 7px;
            background: var(--accent);
            flex-shrink: 0;
        }

        /* Minimalist Button System */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6em;
            font-family: var(--f-mono);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            padding: 1.05em 1.8em;
            border-radius: var(--r-pill);
            border: 1px solid transparent;
            cursor: pointer;
            transition: transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--accent);
            color: #080808 !important;
            box-shadow: 0 0 25px -5px rgba(212, 175, 55, 0.4);
        }
        .btn-primary:hover {
            background: var(--accent-glow);
            transform: translateY(-2px);
            box-shadow: 0 0 35px 0px rgba(212, 175, 55, 0.5);
        }
        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--line-2);
            color: var(--fg) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--divider);
            transform: translateY(-2px);
            color: #ffffff !important;
        }

        /* Minimalist Glow Cards */
        .glow-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            box-shadow: var(--shadow-card);
            transition: border-color var(--dur-normal) var(--ease), background var(--dur-normal) var(--ease), transform var(--dur-normal) var(--ease);
        }
        .glow-card:hover {
            border-color: var(--line-2);
            background: var(--bg-2);
            transform: translateY(-2px);
        }

        .custom-scrollbar::-webkit-scrollbar {
          width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
          background: var(--bg);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
          background: var(--line-2);
          border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background: var(--accent);
        }

        /* Scrollbar hide utility */
        .scrollbar-hide::-webkit-scrollbar {
          display: none;
        }
        .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
